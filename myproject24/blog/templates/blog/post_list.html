<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Search Results & Filter</h1>

    <form action="" method="get" class="search-form">
        <input type="text" name="q" placeholder="Search..." value="{{ query }}">
        <select name="category">
            <option value="">All Categories</option>
            <option value="tech" {% if category == "tech" %}selected{% endif %}>Tech</option>
            <option value="news" {% if category == "news" %}selected{% endif %}>News</option>
            <option value="sports" {% if category == "sports" %}selected{% endif %}>Sports</option>
            <!-- Add your category options here -->
        </select>
        <button type="submit">Search</button>
    </form>
    <ul>
        {% for post in posts %}
            <li>
                <h2>{{ post.title }}</h2>
                <p>{{ post.content }}</p>
                <p><strong>Category:</strong> {{ post.category }}</p>
            </li>
        {% empty %}
            <li>No posts found.</li>
        {% endfor %}
    </ul>
</body>
</html>
