{% extends "blog/base.html" %}
{% block content %}
<h1>all blog posts</h1>
    <div class="container mt-4">
        <h1>Blog Posts</h1>
        <ul class="list-group">
            {% for post in posts %}
                <li class="list-group-item">
                    <a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a>
                </li>
            {% empty %}
                <li class="list-group-item">No posts available.</li>
            {% endfor %}
        </ul>
    </div>
{% endblock content %}
