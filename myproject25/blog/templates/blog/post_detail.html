{% extends "blog/base.html" %}
{% block content %}
<h2>{{ post.title }}</h2>
<p>{{ post.content }}</p>

<a href="{% url 'post_list' %}" class="btn btn-secondary">Back to all Posts</a>
<a href="{% url 'post_edit' post.pk %}" class="btn btn-outline-primary">Edit Post</a>
<a href="{% url 'post_delete' post.pk %}" class="btn btn-outline-danger">Delete Post</a>
{% endblock %}
