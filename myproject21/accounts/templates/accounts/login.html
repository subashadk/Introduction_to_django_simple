{% extends "accounts/base.html" %}
{% block content %}
    <h2>login</h2>
    <form action="" method="post">
        {% csrf_token %}
        {% comment %} {{ form.as_p }} {% endcomment %}
        <p>
            Username: <input type="text" name="username" value="{{ form.username.value }}">

        </p>
        <p>
            Password: <input type="password" name="password" value="{{ form.password.value }}">
        </p>
        <button type="submit">login</button>
    </form>
{% endblock content %}
